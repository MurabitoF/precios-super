name: cargar

on:
  schedule:
    - cron: "0 20 * * *"  # una hora después del archivador
  workflow_dispatch:
    inputs:
      fecha:
        description: Fecha a recargar (AAAA-MM-DD). Vacío pone al día todas las pendientes.
        required: false

permissions:
  id-token: write  # OIDC: el rol se asume sin claves guardadas
  contents: read

concurrency: cargar

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cargador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compilar
        run: ./mvnw -B -q -DskipTests package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CARGADOR_ROLE_ARN }}
          aws-region: us-east-1
      - name: Cargar
        run: java -jar target/cargador-*.jar $FECHA
        env:
          FECHA: ${{ inputs.fecha }}  # por env y no en el comando, para que no se interprete como shell
          TURSO_URL: ${{ vars.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          CARGA_BUCKET: ${{ vars.BUCKET }}
