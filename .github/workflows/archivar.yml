name: archivar

on:
  schedule:
    - cron: "0 19 * * *"  # todos los días; el miércoles se publica ~16:19 UTC
  workflow_dispatch:

permissions:
  id-token: write  # OIDC: el rol se asume sin claves guardadas
  contents: read

concurrency: archivar

jobs:
  archivar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_ARN }}
          aws-region: us-east-1
      - name: Archivar el miércoles publicado
        run: scripts/archivar.sh
        env:
          BUCKET: ${{ vars.BUCKET }}
