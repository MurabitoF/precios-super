spring.application.name=cargador
spring.main.banner-mode=off

# Turso: URL libsql:// o https:// de la base y token limitado a ella. En local, libsql-server sin token.
carga.turso.url=${TURSO_URL:http://localhost:8080}
carga.turso.token=${TURSO_TOKEN:}

# Filas por INSERT. Con 6 parámetros por fila queda lejos del límite de 32.766 de SQLite.
carga.lote=1000
carga.bucket=${CARGA_BUCKET:}
