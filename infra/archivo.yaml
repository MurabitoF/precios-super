# Archivo de ZIP SEPA: bucket privado y rol que asume GitHub Actions por OIDC, sin claves guardadas.
# El rol lo asume el workflow del repo privado precios-super-archivador, que corre en un runner propio
# con IP argentina: el portal de datos bloquea las IP de la nube (ver README).
# Despliegue (una vez):
#   aws cloudformation deploy --stack-name precios-super-archivo --template-file infra/archivo.yaml \
#     --capabilities CAPABILITY_NAMED_IAM --region us-east-1
AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  # Formato inmutable del sub de GitHub (dueño@id/repo@id): un repo recreado con el mismo
  # nombre no puede asumir el rol. Se consulta con:
  #   gh api repos/<dueño>/<repo>/actions/oidc/customization/sub
  GitHubRepo:
    Type: String
    Default: MurabitoF@66337385/precios-super-archivador@1466641119
    Description: Repositorio cuyo workflow en main puede asumir el rol, en formato dueño@id/repo@id.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain  # el archivo es irrecuperable: borrar el stack no lo borra
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  # Uno por cuenta: si la cuenta ya tiene el proveedor de GitHub, este recurso falla al crearse.
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  RolArchivador:
    Type: AWS::IAM::Role
    Properties:
      RoleName: precios-super-archivador
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidc}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: archivo-sepa
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Sin ListBucket, head-object de un objeto inexistente da 403 en vez de 404.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${Bucket.Arn}/sepa/*

Outputs:
  BucketName:
    Value: !Ref Bucket
  RoleArn:
    Value: !GetAtt RolArchivador.Arn
