spring.application.name=api
spring.main.banner-mode=off
spring.mvc.problemdetails.enabled=true

# Turso: en Lambda el token de solo lectura sale de SSM (TURSO_TOKEN_PARAM); en local, directo o vacío.
api.turso.url=${TURSO_URL:http://localhost:8080}
api.turso.token=${TURSO_TOKEN:}
api.turso.token-param=${TURSO_TOKEN_PARAM:}
# Cada cuánto se mira si hay una fecha completa nueva para renovar catálogo y fechas.
api.refresco=10m
